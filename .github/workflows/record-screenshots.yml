name: Record screenshots

# Re-records the golden screenshots on the CI runner (the reference
# renderer) and commits them to the branch this workflow is run on.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Record goldens
        run: ./gradlew :app:recordRoborazziDebug --stacktrace

      - name: Commit updated goldens
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/test/screenshots
          git diff --cached --quiet && echo "goldens unchanged" && exit 0
          git commit -m "Re-record screenshot goldens on CI"
          git push
