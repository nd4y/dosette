name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # A tag can land on any commit; do not sign what does not pass tests.
      - name: Unit tests
        run: ./gradlew :app:testReleaseUnitTest --stacktrace

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          DOSETTE_KEYSTORE: ${{ runner.temp }}/release.jks
          DOSETTE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          DOSETTE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          DOSETTE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease "-Pdosette.version=$GITHUB_REF_NAME" --stacktrace

      - name: Rename and checksum
        run: |
          mv app/build/outputs/apk/release/app-release.apk "dosette-$GITHUB_REF_NAME.apk"
          sha256sum "dosette-$GITHUB_REF_NAME.apk" > "dosette-$GITHUB_REF_NAME.apk.sha256"

      - name: Create GitHub release
        # Third-party action in a job holding the signing secrets: pinned to
        # a commit, not a movable tag (dependabot bumps the pin). v3.0.3.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          files: |
            dosette-*.apk
            dosette-*.apk.sha256
          generate_release_notes: true
