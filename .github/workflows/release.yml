name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      version:
        description: 'Preview version (vX.Y.Z); builds signed artifacts without publishing'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # A tag or manual preview can point at any commit. Run the same gates as CI
      # before making the signing key available to a step.
      - name: Static checks and release-script tests
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          ./gradlew spotlessCheck :app:detekt :link:detekt :wear:detekt --stacktrace

      - name: Unit tests and screenshot verification
        run: ./gradlew :app:verifyRoborazziDebug :link:testDebugUnitTest :adb:testDebugUnitTest :wear:verifyRoborazziDebug --stacktrace

      - name: Coverage and lint
        run: ./gradlew :app:koverVerify :app:lint :wear:lint :adb:lint --stacktrace

      - name: Decode existing release keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Missing KEYSTORE_B64 secret"; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed phone and Wear APKs and App Bundles
        env:
          DOSETTE_KEYSTORE: ${{ runner.temp }}/release.jks
          DOSETTE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          DOSETTE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          DOSETTE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :wear:assembleRelease :app:bundleRelease :wear:bundleRelease "-Pdosette.version=$RELEASE_VERSION" --stacktrace

      - name: Verify release identity and device compatibility
        run: python3 scripts/verify_release.py --version "$RELEASE_VERSION"

      - name: Rename and checksum
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/dosette-$RELEASE_VERSION.apk"
          cp wear/build/outputs/apk/release/wear-release.apk "dist/dosette-wear-$RELEASE_VERSION.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/dosette-$RELEASE_VERSION.aab"
          cp wear/build/outputs/bundle/release/wear-release.aab "dist/dosette-wear-$RELEASE_VERSION.aab"
          cd dist
          for artifact in *.apk *.aab; do sha256sum "$artifact" > "$artifact.sha256"; done

      - name: Save signed artifacts and R8 mappings
        uses: actions/upload-artifact@v7
        with:
          name: dosette-${{ env.RELEASE_VERSION }}-${{ github.run_id }}
          if-no-files-found: error
          path: |
            dist/*
            app/build/outputs/mapping/release/mapping.txt
            wear/build/outputs/mapping/release/mapping.txt

      - name: Create GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        # Third-party action in a signing job: pinned to a commit. v3.0.3.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Remove temporary keystore
        if: always()
        run: rm -f -- "$RUNNER_TEMP/release.jks"

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-reports
          path: |
            **/build/reports/**
            **/build/outputs/roborazzi/**
            app/src/test/screenshots/*_compare.png
            wear/src/test/screenshots/*_compare.png
