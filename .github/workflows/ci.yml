name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Static checks
        run: ./gradlew spotlessCheck :app:detekt --stacktrace

      - name: Unit tests and screenshot verify
        run: ./gradlew :app:verifyRoborazziDebug --stacktrace

      - name: Coverage gate
        run: ./gradlew :app:koverVerify --stacktrace

      - name: Android lint
        run: ./gradlew :app:lint --stacktrace

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/**
            **/build/outputs/roborazzi/**
            app/src/test/screenshots/*_compare.png
