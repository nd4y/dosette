name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Static checks
        run: ./gradlew spotlessCheck :app:detekt :link:detekt :wear:detekt --stacktrace

      - name: Unit tests and screenshot verify
        run: ./gradlew :app:verifyRoborazziDebug :link:testDebugUnitTest :wear:verifyRoborazziDebug --stacktrace

      - name: Coverage gate
        run: ./gradlew :app:koverVerify --stacktrace

      - name: Android lint
        run: ./gradlew :app:lint :wear:lint --stacktrace

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug :wear:assembleDebug --stacktrace

      # R8 smoke: keep-rule breakage (the widget's failure class) must
      # surface here, not in the tag-triggered release build. Debug-signed,
      # nothing is published.
      - name: Assemble minified release
        run: ./gradlew :app:assembleRelease :wear:assembleRelease --stacktrace

      # The Wear capability array is read by Play services by name, nothing in
      # the code references it; the resource shrinker silently dropped it once.
      - name: Wear capability survives resource shrinking
        run: |
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump resources app/build/outputs/apk/release/app-release.apk | grep -q "array/android_wear_capabilities"

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/**
            **/build/outputs/roborazzi/**
            app/src/test/screenshots/*_compare.png
            wear/src/test/screenshots/*_compare.png
