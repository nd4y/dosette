<!doctype html>
<html>

          <circle cx="42" cy="42" r="34" stroke="#80D4D6" stroke-dasharray="36 177.6" transform="rotate(-90 42 42)"/>
          <circle cx="42" cy="42" r="34" stroke="#80D4D6" stroke-dasharray="36 177.6" transform="rotate(-18 42 42)"/>
          <circle cx="42" cy="42" r="34" stroke="#80D4D6" stroke-dasharray="36 177.6" transform="rotate(54 42 42)"/>

      <div style="display: flex; flex-direction: column; gap: 0px;">
        <div style="font-size: 22px; font-weight: 700; color: #DDE4E4; letter-spacing: -0.3px;">20:00</div>
        <div style="font-size: 10.5px; font-weight: 600; color: #80D4D6;">через 2 ч</div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 1px;">
      <div style="font-size: 13.5px; font-weight: 650; color: #DDE4E4;">Метформин</div>
      <div style="font-size: 10.5px; font-weight: 500; color: #BEC8C8;">500 мг · 1 таблетка</div>
    </div>

    <div style="height: 34px; border-radius: 17px; background: #80D4D6; display: flex; align-items: center; justify-content: center; gap: 6px;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#003739" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
      <div style="font-size: 12.5px; font-weight: 650; color: #003739;">Принял</div>
