<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..900&display=swap">
  <style>
    body { margin: 0; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; }
  </style>
</helmet>
<div style="width: 406px; height: 408px; background: linear-gradient(150deg, #131A1B 0%, #1C2627 100%); display: flex; align-items: center; justify-content: center;">
  <div style="width: 358px; height: 360px; box-sizing: border-box; border-radius: 28px; background: #1B2122; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45); padding: 16px; display: flex; flex-direction: column; gap: 8px;">

    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="display: flex; flex-direction: column; gap: 0px;">
        <div style="font-size: 17px; font-weight: 700; color: #DDE4E4;">Сегодня</div>
        <div style="font-size: 11px; font-weight: 500; color: #BEC8C8;">воскресенье, 30 августа</div>
      </div>
      <svg width="44" height="44" viewBox="0 0 84 84">
        <g stroke-width="9" fill="none" stroke-linecap="round">
          <circle cx="42" cy="42" r="34" stroke="#80D4D6" stroke-dasharray="36 177.6" transform="rotate(-90 42 42)"/>
          <circle cx="42" cy="42" r="34" stroke="#80D4D6" stroke-dasharray="36 177.6" transform="rotate(-18 42 42)"/>
          <circle cx="42" cy="42" r="34" stroke="#80D4D6" stroke-dasharray="36 177.6" transform="rotate(54 42 42)"/>
          <circle cx="42" cy="42" r="34" stroke="#00363A" stroke-dasharray="36 177.6" transform="rotate(126 42 42)"/>
          <circle cx="42" cy="42" r="34" stroke="#00363A" stroke-dasharray="36 177.6" transform="rotate(198 42 42)"/>
        </g>
        <text x="42" y="50" text-anchor="middle" font-size="22" font-weight="700" fill="#9BF0F2" font-family="'Roboto Flex', Roboto, sans-serif">3/5</text>
      </svg>
    </div>

    <div style="display: flex; align-items: center; gap: 8px;">
      <div style="font-size: 11.5px; font-weight: 700; color: #DDE4E4;">Утро · 08:00</div>
      <div style="flex: 1; height: 1px; background: #3F4948;"></div>
      <div style="font-size: 10.5px; font-weight: 600; color: #80D4D6;">все приняты</div>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; padding: 5px 8px; border-radius: 12px; background: #252B2B;">
      <div style="width: 26px; height: 26px; border-radius: 9px; background: #6A3C00; display: flex; align-items: center; justify-content: center;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#FFDCC0" stroke-width="2" stroke-linecap="round"><g transform="rotate(45 12 12)"><rect x="4" y="8" width="16" height="8" rx="4"/><path d="M12 8v8"/></g></svg>
      </div>
      <div style="font-size: 12.5px; font-weight: 600; color: #DDE4E4; flex: 1;">Метформин · 500 мг</div>
      <div style="width: 22px; height: 22px; border-radius: 11px; background: #80D4D6; display: flex; align-items: center; justify-content: center;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#003739" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; padding: 5px 8px; border-radius: 12px; background: #252B2B;">
      <div style="width: 26px; height: 26px; border-radius: 9px; background: #3A5A0B; display: flex; align-items: center; justify-content: center;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#D8F0BC" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.6"/></svg>
      </div>
      <div style="font-size: 12.5px; font-weight: 600; color: #DDE4E4; flex: 1;">Витамин D · 2000 МЕ</div>
      <div style="width: 22px; height: 22px; border-radius: 11px; background: #80D4D6; display: flex; align-items: center; justify-content: center;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#003739" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 8px; margin-top: 2px;">
      <div style="font-size: 11.5px; font-weight: 700; color: #DDE4E4;">Вечер · 20:00</div>
      <div style="flex: 1; height: 1px; background: #3F4948;"></div>
      <div style="font-size: 10.5px; font-weight: 600; color: #BEC8C8;">через 2 ч</div>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 14px; background: #2A3132;">
      <div style="width: 32px; height: 32px; border-radius: 11px; background: #6A3C00; display: flex; align-items: center; justify-content: center;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFDCC0" stroke-width="2" stroke-linecap="round"><g transform="rotate(45 12 12)"><rect x="4" y="8" width="16" height="8" rx="4"/><path d="M12 8v8"/></g></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 0px; flex: 1;">
        <div style="font-size: 13px; font-weight: 650; color: #DDE4E4;">Метформин</div>
        <div style="font-size: 10.5px; font-weight: 500; color: #BEC8C8;">500 мг · 1 таблетка</div>
      </div>
      <div style="height: 32px; padding: 0 14px; border-radius: 16px; background: #80D4D6; color: #003739; font-size: 12px; font-weight: 650; display: flex; align-items: center;">Принял</div>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 14px; background: #2A3132;">
      <div style="width: 32px; height: 32px; border-radius: 11px; background: #703349; display: flex; align-items: center; justify-content: center;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFD8E6" stroke-width="2" stroke-linecap="round"><ellipse cx="12" cy="12" rx="8" ry="5.5"/><path d="M7 10.2c1.6 1.2 8.4 2.4 10 3.6"/></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 0px; flex: 1;">
        <div style="font-size: 13px; font-weight: 650; color: #DDE4E4;">Аторвастатин</div>
        <div style="font-size: 10.5px; font-weight: 500; color: #BEC8C8;">20 мг · 1 таблетка</div>
      </div>
      <div style="height: 32px; padding: 0 14px; border-radius: 16px; background: #80D4D6; color: #003739; font-size: 12px; font-weight: 650; display: flex; align-items: center;">Принял</div>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; padding: 5px 8px; border-radius: 12px; border: 1px dashed #5C6666;">
      <div style="width: 26px; height: 26px; border-radius: 9px; background: #423B77; display: flex; align-items: center; justify-content: center;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#E5DEFF" stroke-width="2" stroke-linecap="round"><g transform="rotate(45 12 12)"><rect x="4" y="8" width="16" height="8" rx="4"/><path d="M12 8v8"/></g></svg>
      </div>
      <div style="font-size: 12px; font-weight: 600; color: #DDE4E4; flex: 1;">Ибупрофен · по необходимости</div>
      <div style="width: 26px; height: 26px; border-radius: 9px; background: #324B4C; display: flex; align-items: center; justify-content: center;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#CBE8E8" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
