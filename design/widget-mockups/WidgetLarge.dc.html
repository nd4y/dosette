<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..900&display=swap">
  <style>
    body { margin: 0; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; }
  </style>
</helmet>
<div style="width: 406px; height: 408px; background: linear-gradient(150deg, #DCE7E6 0%, #C9DCDB 100%); display: flex; align-items: center; justify-content: center;">
  <div style="width: 358px; height: 360px; box-sizing: border-box; border-radius: 28px; background: #F6FAFA; box-shadow: 0 4px 14px rgba(22, 29, 29, 0.18); padding: 16px; display: flex; flex-direction: column; gap: 8px;">

    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="display: flex; flex-direction: column; gap: 0px;">
        <div style="font-size: 17px; font-weight: 700; color: #161D1D;">Сегодня</div>
        <div style="font-size: 11px; font-weight: 500; color: #3F4948;">воскресенье, 30 августа</div>
      </div>
      <svg width="44" height="44" viewBox="0 0 84 84">
        <g stroke-width="9" fill="none" stroke-linecap="round">
          <circle cx="42" cy="42" r="34" stroke="#00696B" stroke-dasharray="36 177.6" transform="rotate(-90 42 42)"/>
          <circle cx="42" cy="42" r="34" stroke="#00696B" stroke-dasharray="36 177.6" transform="rotate(-18 42 42)"/>
          <circle cx="42" cy="42" r="34" stroke="#00696B" stroke-dasharray="36 177.6" transform="rotate(54 42 42)"/>
          <circle cx="42" cy="42" r="34" stroke="#CBE8E8" stroke-dasharray="36 177.6" transform="rotate(126 42 42)"/>
          <circle cx="42" cy="42" r="34" stroke="#CBE8E8" stroke-dasharray="36 177.6" transform="rotate(198 42 42)"/>
        </g>
        <text x="42" y="50" text-anchor="middle" font-size="22" font-weight="700" fill="#002021" font-family="'Roboto Flex', Roboto, sans-serif">3/5</text>
      </svg>
    </div>

    <div style="display: flex; align-items: center; gap: 8px;">
      <div style="font-size: 11.5px; font-weight: 700; color: #161D1D;">Утро · 08:00</div>
      <div style="flex: 1; height: 1px; background: #BEC8C8;"></div>
      <div style="font-size: 10.5px; font-weight: 600; color: #00696B;">все приняты</div>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; padding: 5px 8px; border-radius: 12px; background: #E9EFEF;">
      <div style="width: 26px; height: 26px; border-radius: 9px; background: #FFE0B0; display: flex; align-items: center; justify-content: center;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#5A3C00" stroke-width="2" stroke-linecap="round"><g transform="rotate(45 12 12)"><rect x="4" y="8" width="16" height="8" rx="4"/><path d="M12 8v8"/></g></svg>
      </div>
      <div style="font-size: 12.5px; font-weight: 600; color: #161D1D; flex: 1;">Метформин · 500 мг</div>
      <div style="width: 22px; height: 22px; border-radius: 11px; background: #00696B; display: flex; align-items: center; justify-content: center;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; padding: 5px 8px; border-radius: 12px; background: #E9EFEF;">
      <div style="width: 26px; height: 26px; border-radius: 9px; background: #D8F0BC; display: flex; align-items: center; justify-content: center;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#315200" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.6"/></svg>
      </div>
      <div style="font-size: 12.5px; font-weight: 600; color: #161D1D; flex: 1;">Витамин D · 2000 МЕ</div>
      <div style="width: 22px; height: 22px; border-radius: 11px; background: #00696B; display: flex; align-items: center; justify-content: center;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 8px; margin-top: 2px;">
      <div style="font-size: 11.5px; font-weight: 700; color: #161D1D;">Вечер · 20:00</div>
      <div style="flex: 1; height: 1px; background: #BEC8C8;"></div>
      <div style="font-size: 10.5px; font-weight: 600; color: #3F4948;">через 2 ч</div>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 14px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(22, 29, 29, 0.10);">
      <div style="width: 32px; height: 32px; border-radius: 11px; background: #FFE0B0; display: flex; align-items: center; justify-content: center;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5A3C00" stroke-width="2" stroke-linecap="round"><g transform="rotate(45 12 12)"><rect x="4" y="8" width="16" height="8" rx="4"/><path d="M12 8v8"/></g></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 0px; flex: 1;">
        <div style="font-size: 13px; font-weight: 650; color: #161D1D;">Метформин</div>
        <div style="font-size: 10.5px; font-weight: 500; color: #3F4948;">500 мг · 1 таблетка</div>
      </div>
      <div style="height: 32px; padding: 0 14px; border-radius: 16px; background: #00696B; color: #FFFFFF; font-size: 12px; font-weight: 650; display: flex; align-items: center;">Принял</div>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 14px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(22, 29, 29, 0.10);">
      <div style="width: 32px; height: 32px; border-radius: 11px; background: #FAD3E4; display: flex; align-items: center; justify-content: center;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B2C4E" stroke-width="2" stroke-linecap="round"><ellipse cx="12" cy="12" rx="8" ry="5.5"/><path d="M7 10.2c1.6 1.2 8.4 2.4 10 3.6"/></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 0px; flex: 1;">
        <div style="font-size: 13px; font-weight: 650; color: #161D1D;">Аторвастатин</div>
        <div style="font-size: 10.5px; font-weight: 500; color: #3F4948;">20 мг · 1 таблетка</div>
      </div>
      <div style="height: 32px; padding: 0 14px; border-radius: 16px; background: #00696B; color: #FFFFFF; font-size: 12px; font-weight: 650; display: flex; align-items: center;">Принял</div>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; padding: 5px 8px; border-radius: 12px; border: 1px dashed #6F7979;">
      <div style="width: 26px; height: 26px; border-radius: 9px; background: #E5DEFF; display: flex; align-items: center; justify-content: center;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#423B77" stroke-width="2" stroke-linecap="round"><g transform="rotate(45 12 12)"><rect x="4" y="8" width="16" height="8" rx="4"/><path d="M12 8v8"/></g></svg>
      </div>
      <div style="font-size: 12px; font-weight: 600; color: #161D1D; flex: 1;">Ибупрофен · по необходимости</div>
      <div style="width: 26px; height: 26px; border-radius: 9px; background: #CBE8E8; display: flex; align-items: center; justify-content: center;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#041F20" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
